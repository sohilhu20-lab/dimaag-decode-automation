name: Dimaag Decode Auto Pipeline

on:
  schedule:
    - cron: '*/05 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install edge-tts gspread google-auth google-auth-oauthlib google-auth-httplib2 moviepy==1.0.3

      - name: Run Automation Script
        run: python bot.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
